<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Change Password | Movie Mint</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css"><script src="js/script.js" defer></script>
</head>
<body class="auth-page">
<header><a href="index.html" class="logo">Movie <span>Mint</span></a><nav id="navMenu"></nav></header>
<main class="auth-shell"><section class="auth-card"><span class="eyebrow">Account settings</span><h1>Change Password</h1>
    <div id="changePasswordMessage" class="alert d-none" role="status" aria-live="polite"></div>
    <form id="changePasswordForm" novalidate>
        <div class="mb-3"><label for="currentPassword" class="form-label">Current Password</label><div class="password-input-wrap"><input class="form-control" id="currentPassword" type="password" autocomplete="current-password" required><button class="password-toggle" type="button" data-password-toggle="currentPassword" aria-label="Show current password">Show</button></div></div>
        <div class="mb-3"><label for="newPassword" class="form-label">New Password</label><div class="password-input-wrap"><input class="form-control" id="newPassword" type="password" autocomplete="new-password" required minlength="8"><button class="password-toggle" type="button" data-password-toggle="newPassword" aria-label="Show new password">Show</button></div></div>
        <div class="mb-3"><label for="confirmNewPassword" class="form-label">Confirm New Password</label><div class="password-input-wrap"><input class="form-control" id="confirmNewPassword" type="password" autocomplete="new-password" required minlength="8"><button class="password-toggle" type="button" data-password-toggle="confirmNewPassword" aria-label="Show confirmed password">Show</button></div></div>
        <button class="btn w-100" type="submit">Update Password</button>
    </form><p class="auth-demo-note">Demo only: password changes are not stored. A secure backend is required.</p>
    <a class="auth-home-link" href="login.html">← Back to Login</a>
</section></main><footer>© 2026 Movie Mint · Frontend demo</footer>
</body></html>
