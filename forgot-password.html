<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forgot Password | Movie Mint</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/forgot-password.css">
    <script src="js/validation.js" defer></script>
    <script src="js/script.js" defer></script>
</head>
<body class="auth-page">
<header><a href="index.html" class="logo">Movie <span>Mint</span></a><nav id="navMenu"></nav></header>
<main class="auth-shell"><section class="auth-card"><span class="eyebrow">Account help</span><h1>Forgot password?</h1><p>Enter the email or mobile number associated with your account.</p>
    <div id="forgotPasswordFeedback" class="alert d-none" role="status" aria-live="polite"></div>
    <form id="forgotPasswordForm" novalidate><div class="mb-3"><label for="resetIdentity" class="form-label">Registered Email or Mobile</label><input class="form-control" id="resetIdentity" autocomplete="username" required><div class="invalid-feedback">Enter your registered email or mobile number.</div></div><button class="btn w-100" type="submit">Send Reset Link</button></form>
    <p class="auth-demo-note">Demo only: no reset link or SMS is sent. Password recovery needs a secure backend.</p>
    <a class="auth-home-link" href="login.html">← Back to Login</a>
</section></main><footer>© 2026 Movie Mint · Frontend demo</footer>
</body></html>
